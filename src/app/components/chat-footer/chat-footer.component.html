<ion-footer>
  @if (noteOptions.message.trim() !== '') {
  <div class="note">
    <ion-note [color]="noteOptions.color">
      {{ noteOptions.message }}
    </ion-note>
  </div>
  }
  <div class="recommended-messages">
    @for (item of recomendedMessages; track $index) {
      <ion-chip [disabled]="disabled"
        outline="false"
        (click)="onRecommendedMessageClick(item)">
        {{ item }}
      </ion-chip>
    }
  </div>
  <ion-toolbar>
    <div class="input-container">
      <ion-input [placeholder]="placeholder" [disabled]="disabled" type="text" enterkeyhint="send"
        #inputElement
        (keydown)="onInputEnter($event, String(inputElement.value ?? ''))">
      </ion-input>
      <ion-button [disabled]="disabled" slot="end" shape="round" (click)="onSendMessage(String(inputElement.value ?? ''))">
        <ion-icon name="send" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
